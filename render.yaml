services:
  - type: web
    name: skytouch-engineering
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skytouch-db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true

databases:
  - name: skytouch-db
    databaseName: skytouch
    user: skytouch_user
    plan: free
