<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Skytouch Engineering | Building Your Dream Structure{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="top-bar">
            <div class="info">
                <span><i class="fas fa-envelope"></i> contact@skytouch.com</span>
                <span style="margin-left: 20px;"><i class="fas fa-map-marker-alt"></i> Dhaka, Bangladesh</span>
            </div>
            <div class="socials">
                <i class="fab fa-facebook-f"></i>
                <i class="fab fa-linkedin-in" style="margin-left: 15px;"></i>
                <i class="fab fa-whatsapp" style="margin-left: 15px;"></i>
            </div>
        </div>
        <div class="nav-container">
            <div class="logo">
                <div class="logo-text">SKYTOUCH<br><span style="font-size: 0.8rem; letter-spacing: 5px;">ENGINEERING</span></div>
            </div>
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </button>
            <nav class="nav-menu" id="navMenu">
                <ul>
                    <li><a href="{{ url_for('index') }}">Home</a></li>
                    <li><a href="{{ url_for('about') }}">About Us</a></li>
                    <li><a href="{{ url_for('services') }}">Services</a></li>
                    <li><a href="{{ url_for('projects') }}">Projects</a></li>
                    <li><a href="{{ url_for('contact') }}">Contact Us</a></li>
                </ul>
                <a href="{{ url_for('contact') }}" class="cta-button mobile-cta">Get a Quote</a>
            </nav>
            <a href="{{ url_for('contact') }}" class="cta-button desktop-cta">Get a Quote</a>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer style="background: #002244; color: white; padding: 50px 5%; text-align: center;">
        <p>&copy; 2026 Skytouch Engineering. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('menuToggle').addEventListener('click', function() {
            var menu = document.getElementById('navMenu');
            var icon = this.querySelector('i');
            menu.classList.toggle('active');
            if (menu.classList.contains('active')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-times');
            } else {
                icon.classList.remove('fa-times');
                icon.classList.add('fa-bars');
            }
        });
    </script>
</body>
</html>
