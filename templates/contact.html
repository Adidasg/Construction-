{% extends "base.html" %}

{% block content %}
<section class="section" style="padding-top: 150px;">
    <div class="section-header" style="text-align: center;">
        <span>Get in Touch</span>
        <h2>Contact Us For A Quote</h2>
    </div>
    <div style="max-width: 600px; margin: 0 auto; background: var(--white); padding: 40px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
        <form action="{{ url_for('contact') }}" method="POST">
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Full Name</label>
                <input type="text" name="name" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Email Address</label>
                <input type="email" name="email" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Subject</label>
                <select name="subject" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px;">
                    <option value="quote">Get a Quote</option>
                    <option value="inquiry">General Inquiry</option>
                    <option value="service">Service Request</option>
                </select>
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Message</label>
                <textarea name="message" rows="5" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px;"></textarea>
            </div>
            <button type="submit" class="cta-button" style="width: 100%; border: none; cursor: pointer; font-size: 1rem;">Send Message</button>
        </form>
    </div>
</section>
{% endblock %}
