{% extends "base.html" %}

{% block content %}
<section class="section" style="padding-top: 150px;">
    <div class="section-header" style="text-align: center;">
        <span>Our Portfolio</span>
        <h2>Showcasing Our Work</h2>
    </div>
    <div class="features-grid" style="grid-template-columns: repeat(2, 1fr);">
        <div class="feature-card" style="padding: 0; overflow: hidden; height: 300px; position: relative;">
            <div style="background: #000; width: 100%; height: 100%; opacity: 0.6;"></div>
            <div style="position: absolute; bottom: 20px; left: 20px; color: white; text-align: left;">
                <h4 style="margin: 0;">Modern Skyline Apartments</h4>
                <p style="margin: 0;">Dhaka, Residential</p>
            </div>
        </div>
        <div class="feature-card" style="padding: 0; overflow: hidden; height: 300px; position: relative;">
            <div style="background: #333; width: 100%; height: 100%; opacity: 0.6;"></div>
            <div style="position: absolute; bottom: 20px; left: 20px; color: white; text-align: left;">
                <h4 style="margin: 0;">Industrial Hub Warehouse</h4>
                <p style="margin: 0;">Gazipur, Commercial</p>
            </div>
        </div>
        <div class="feature-card" style="padding: 0; overflow: hidden; height: 300px; position: relative;">
            <div style="background: #444; width: 100%; height: 100%; opacity: 0.6;"></div>
            <div style="position: absolute; bottom: 20px; left: 20px; color: white; text-align: left;">
                <h4 style="margin: 0;">Green Valley Resort</h4>
                <p style="margin: 0;">Sylhet, Hospitality</p>
            </div>
        </div>
        <div class="feature-card" style="padding: 0; overflow: hidden; height: 300px; position: relative;">
            <div style="background: #222; width: 100%; height: 100%; opacity: 0.6;"></div>
            <div style="position: absolute; bottom: 20px; left: 20px; color: white; text-align: left;">
                <h4 style="margin: 0;">Metro Bridge Project</h4>
                <p style="margin: 0;">Chittagong, Infrastructure</p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
